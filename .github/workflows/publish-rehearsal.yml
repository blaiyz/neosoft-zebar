name: Publish rehearsal

on:
  pull_request:
    paths:
      - .github/actions/**
      - .github/workflows/build.yml
      - .github/workflows/publish-marketplace.yml
      - .github/workflows/publish-rehearsal.yml
      - LICENSE
      - README.md
      - scripts/build.js
      - scripts/publish_stub.ts
      - static/**
  workflow_dispatch:

concurrency:
  group: publish-rehearsal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  rehearse:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: 0.0.0
      RELEASE_URL: https://github.com/blaiyz/neosoft-zebar/releases
      ZEBAR_PUBLISH_TOKEN: rehearsal
      RELEASE_NOTES: |-
        ## "Double", 'single' and `backtick` quotes

        - $HOME, ${HOME}, $(date) and \backslashes stay as written
        - Rosé Pine ✨
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: build/

      - uses: ./.github/actions/zebar-cli

      - name: Publish to the stub
        run: |
          node scripts/publish_stub.ts &
          stub=$!
          timeout 10 bash -c 'until curl -s -o /dev/null http://127.0.0.1:8787; do sleep 0.2; done'

          zebar publish --pack-config ./build/zpack.json \
            --version-override "$VERSION" \
            --commit-sha "$(git rev-parse --short HEAD)" \
            --release-notes "$RELEASE_NOTES" \
            --release-url "$RELEASE_URL" \
            --api-url http://127.0.0.1:8787

          wait "$stub"

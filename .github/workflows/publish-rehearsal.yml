name: Publish rehearsal

on:
  pull_request:
    paths:
      - .github/actions/**
      - .github/workflows/build.yml
      - .github/workflows/publish-marketplace.yml
      - .github/workflows/publish-rehearsal.yml
      - LICENSE
      - README.md
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/build.js
      - scripts/publish.sh
      - scripts/publish_stub.ts
      - static/**
      - vite.config.ts
  workflow_dispatch:

concurrency:
  group: publish-rehearsal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  rehearse:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: 0.0.0
      RELEASE_URL: https://github.com/blaiyz/neosoft-zebar/releases
      ZEBAR_PUBLISH_TOKEN: rehearsal
      RELEASE_NOTES: |-
        - Starts with a hyphen, like a bullet list
        - "Double", 'single' and `backtick` quotes
        - $HOME, ${HOME}, $(date) and \backslashes stay as written
        - Rosé Pine ✨
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: build/

      - uses: ./.github/actions/zebar-cli

      - name: Publish to the stub
        env:
          ZEBAR_API_URL: http://127.0.0.1:8787
        run: |
          jq -n --arg tagName "v$VERSION" --arg body "$RELEASE_NOTES" --arg url "$RELEASE_URL" \
            '{$tagName, $body, $url}' > "$RUNNER_TEMP/release.json"

          node scripts/publish_stub.ts &
          stub=$!
          timeout 10 bash -c 'until curl -s -o /dev/null http://127.0.0.1:8787; do sleep 0.2; done'

          bash scripts/publish.sh "$RUNNER_TEMP/release.json"
          wait "$stub"

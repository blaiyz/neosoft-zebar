name: Publish to Zebar Marketplace

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 1.0.0 or v1.0.0). Leave empty to use latest release."
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.release.draft == false
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: build/

      - uses: ./.github/actions/zebar-cli

      - name: Get release info
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          # With no version, gh picks the latest release.
          gh release view ${VERSION:+"v${VERSION#v}"} --json tagName,body,url > "$RUNNER_TEMP/release.json"

      - name: Publish to Zebar marketplace
        env:
          ZEBAR_PUBLISH_TOKEN: ${{ secrets.ZEBAR_PUBLISH_TOKEN }}
        run: bash scripts/publish.sh "$RUNNER_TEMP/release.json"

name: Release

on:
  workflow_dispatch:
    inputs:
      version-number:
        description: "X.Y.Z, with or without a leading v"
        type: string
        required: true
      release-notes:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the version
        env:
          VERSION: ${{ inputs.version-number }}
        run: |
          if [[ ! "${VERSION#v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' isn't a full version like 2.0.0"
            exit 1
          fi

  build:
    needs: check
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: build/

      - name: Zip release folder
        run: zip -r neosoft-zebar.zip build/

      # Always a draft: publishing it by hand is what starts the marketplace publish,
      # since GitHub doesn't start workflows from releases its own token publishes.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version-number }}
          NOTES: ${{ inputs.release-notes }}
        run: |
          tag="v${VERSION#v}"
          gh release create "$tag" neosoft-zebar.zip \
            --title "Release $tag" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            --draft

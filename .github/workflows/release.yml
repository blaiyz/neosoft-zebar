name: Release

on:
  workflow_dispatch:
    inputs:
      version-number:
        type: string
        required: true
      draft:
        type: boolean
        required: false
        default: false
      release-notes:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: build/

      - name: Zip release folder
        run: zip -r neosoft-zebar.zip build/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version-number }}
          DRAFT: ${{ inputs.draft }}
          NOTES: ${{ inputs.release-notes }}
        run: |
          tag="v${VERSION#v}"
          gh release create "$tag" neosoft-zebar.zip \
            --title "Release $tag" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            --draft="$DRAFT"

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      # 09:00 UTC on the 1st of every other month
      interval: cron
      cronjob: "0 9 1 1,3,5,7,9,11 *"
    cooldown:
      default-days: 7 # matches minimumReleaseAge in pnpm-workspace.yaml
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Moved by hand, with the versions that follow it. See the updates skill.
      - dependency-name: zebar
      # Follows the version zebar depends on. See the updates skill.
      - dependency-name: "@tauri-apps/api"
      # Follows the version zebar depends on. See the updates skill.
      - dependency-name: glazewm

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      # 09:00 UTC on the 1st of every other month
      interval: cron
      cronjob: "0 9 1 1,3,5,7,9,11 *"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # matches minimumReleaseAge in pnpm-workspace.yaml
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Moved by hand, with the versions that follow it. See the updates skill.
      - dependency-name: zebar
      # Follows the version zebar depends on. See the updates skill.
      - dependency-name: "@tauri-apps/api"
      # Follows the version zebar depends on. See the updates skill.
      - dependency-name: glazewm

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
